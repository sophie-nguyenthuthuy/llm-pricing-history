name: refresh

# Daily dataset refresh; also runs once on push to this file so the first
# end-to-end run happens right after setup.
on:
  push:
    paths:
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC (10:17 Hanoi)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Refresh dataset
        run: python refresh.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No pricing changes today."
          else
            git commit -m "data: refresh $(date -u +%F)"
            git push
          fi
